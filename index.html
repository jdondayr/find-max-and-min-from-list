<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Find max and min in a list</title>

    <!-- Stylesheets -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="styles.css">

</head>

<body>

    <div class="container-fluid d-flex flex-column align-items-center gap-3">
        <h1>Find Max and Min in a list</h1>
        <p>This program will find the max and the min value of an interactive list.</p>
        <p>Please, insert numbers to the list using the "Add to the list" button.</p>
        <input type="number" id="numberInput">
        <button id="addButton">Add to the list</button>
        <ul id="numbersList"></ul>
        <button id="resetButton">Reset</button>
        <button id="findMaxAndMinButton">Find Max and Min</button>
        <div id="result"></div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>

</html>
